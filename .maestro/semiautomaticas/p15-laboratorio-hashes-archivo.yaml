# P-15 (en parte, tarea 2): la pestaña Archivo del Laboratorio de hashes con un archivo pequeño de prueba
# (clavero-abc.txt, «abc»), y elegir otro algoritmo después de calcular: «Calcular otra vez con …».
# El archivo de varios GB con su progreso y «Cancelar» es manual (no cabe en el repositorio).
# No borra datos: se puede usar en tu móvil.
# Antes: python3 .maestro/datos/preparar_archivos.py (copia clavero-abc.txt a Descargas).
appId: io.github.egt17baa.seguridad
name: "P-15 Laboratorio de hashes: un archivo"
tags:
  - clavero-1.4.0
  - semiautomatica
---
- runFlow: ../comun/abrir-app.yaml
- runFlow:
    file: ../comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Laboratorio de hashes.*'
- tapOn: "Archivo"
- tapOn: "Elegir archivo"
- runFlow:
    file: ../comun/elegir-en-descargas.yaml
    env:
      ARCHIVO: "clavero-abc.txt"
- extendedWaitUntil:
    visible: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
    timeout: 30000
- assertVisible: "clavero-abc.txt"

# Otro algoritmo: el resultado de antes no se enseña con el nombre nuevo, y se pide calcular otra vez.
- tapOn: "SHA-512"
- assertVisible: "Elegiste otro algoritmo: el resultado de antes ya no vale."
- assertNotVisible: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
- tapOn: "Calcular otra vez con SHA-512"
- extendedWaitUntil:
    visible: 'ddaf35a193617aba.*'
    timeout: 30000

# Comparar con la huella esperada.
- scrollUntilVisible:
    element:
      text: 'Huella esperada \(hex o Base64\)'
    direction: DOWN
- tapOn: 'Huella esperada \(hex o Base64\)'
- inputText: "DDAF35A193617ABACC417349AE20413112E6FA4E89A97EA20A9EEEE64B55D39A2192992A274FC1A836BA3C23A3FEEBBD454D4423643CE80E2A9AC94FA54CA49F"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "✓ Coincide"
    direction: DOWN
- tapOn: "Atrás"
