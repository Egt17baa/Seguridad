# P-17, Repartir un secreto (tarea 4): repartir una frase BIP-39 de prueba en 2 de 3 partes y recomponerla
# con dos de ellas; los textos de «Lo que no protege» y del aviso; el borrado al volver atrás.
# El vector oficial de SLIP-0039 está en semiautomaticas/p17-recomponer-vector-oficial.yaml (pide una
# variable), y el borrado al bloquear, en borra-datos/p15-p16-p17-bloquear-borra.yaml.
# No borra datos: se puede usar en tu móvil.
# La frase es el vector de prueba público de BIP-39 con la entropía a cero (16 bytes 00): no es el secreto
# de nadie. Al recomponer tiene que salir «00000000000000000000000000000000» y la misma frase.
# Las partes salen distintas cada vez (el identificador del reparto es al azar): el flujo las copia de la
# pantalla con copyTextFrom y las vuelve a escribir.
appId: io.github.egt17baa.seguridad
name: "P-17 Repartir un secreto: repartir y recomponer"
tags:
  - clavero-1.4.0
  - automatica
---
- runFlow: comun/abrir-app.yaml
- runFlow:
    file: comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Repartir un secreto.*'
- assertVisible: "Repartir un secreto"
- assertVisible: 'Divide una frase BIP-39 o un secreto en hex en varias partes, con el reparto de secretos de Shamir de SLIP-0039\..*'
- assertVisible: "Lo que no protege"
- assertVisible: 'Quien reúna las partes necesarias obtiene el secreto, sea quien sea.*'
- assertVisible: "Frase BIP-39"
- assertVisible: "Secreto en hex"

# Repartir: 1 grupo, 2 partes necesarias de 3 (lo de entrada).
- tapOn: 'Frase BIP-39 \(12, 15, 18, 21 o 24 palabras en inglés\)'
- inputText: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Se reparte la entropía de la frase, y al recomponer sale la misma frase\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo normal es un solo grupo: por ejemplo, 2 partes necesarias de 3\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Estas partes no son una copia SLIP-39 de cartera\. Metidas en una cartera de hardware.*'
    direction: DOWN
- assertVisible: "Aviso"
- scrollUntilVisible:
    element:
      text: "Repartir"
      below:
        text: 'Estas partes no son una copia SLIP-39 de cartera\. Metidas en una cartera de hardware.*'
      enabled: true
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Repartir"
    below:
      text: 'Estas partes no son una copia SLIP-39 de cartera\. Metidas en una cartera de hardware.*'
- extendedWaitUntil:
    visible: "Parte 1"
    timeout: 60000
- assertVisible: "Un solo grupo."
- assertVisible: "Grupo 1: hacen falta 2 de estas 3 partes"

# Las partes de 128 bits tienen 20 palabras. Se copian la 1 y la 2.
- scrollUntilVisible:
    element:
      text: "Parte 1"
    direction: DOWN
    centerElement: true
- copyTextFrom:
    text: '([a-z]+ ){19}[a-z]+'
    below:
      text: "Parte 1"
- evalScript: ${output.parte1 = maestro.copiedText}
- scrollUntilVisible:
    element:
      text: "Parte 2"
    direction: DOWN
    centerElement: true
- copyTextFrom:
    text: '([a-z]+ ){19}[a-z]+'
    below:
      text: "Parte 2"
- evalScript: ${output.parte2 = maestro.copiedText}
- assertTrue: ${output.parte1 != output.parte2}
- assertTrue: ${output.parte1.split(' ').length == 20}

# Recomponer con las dos partes, una por línea.
- scrollUntilVisible:
    element:
      text: "Recomponer"
    direction: UP
- tapOn: "Recomponer"
- tapOn: "Partes, una por línea"
- inputText: ${output.parte1}
- pressKey: Enter
- inputText: ${output.parte2}
- hideKeyboard
- assertVisible: 'Escribe o pega las partes necesarias, cada una en su línea\..*'
- scrollUntilVisible:
    element:
      text: "Recomponer"
      below:
        text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- tapOn:
    text: "Recomponer"
    below:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
- extendedWaitUntil:
    visible: "00000000000000000000000000000000"
    timeout: 60000
- assertVisible: "Secreto en hex"
- scrollUntilVisible:
    element:
      text: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    direction: DOWN
- assertVisible: "Como frase BIP-39"
- assertVisible: 'Esta es la frase BIP-39 de estos bytes\..*'
- scrollUntilVisible:
    element:
      text: 'Si la contraseña no es la que se usó al repartir, este es otro secreto distinto: SLIP-0039 no avisa\.'
    direction: DOWN

# Con una sola parte no basta.
- scrollUntilVisible:
    element:
      text: "Partes, una por línea|([a-z]+ ){19}[a-z]+.*"
    direction: UP
- tapOn: "Partes, una por línea|([a-z]+ ){19}[a-z]+.*"
- eraseText: 400
- inputText: ${output.parte1}
- hideKeyboard
- assertNotVisible: "00000000000000000000000000000000"
- scrollUntilVisible:
    element:
      text: "Recomponer"
      below:
        text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- tapOn:
    text: "Recomponer"
    below:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
- extendedWaitUntil:
    visible: 'En el grupo 1 hacen falta 2 partes y hay 1\.'
    timeout: 60000
- assertNotVisible: "00000000000000000000000000000000"

# Volver atrás lo borra todo.
- tapOn: "Atrás"
- runFlow:
    file: comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Repartir un secreto.*'
- assertNotVisible: "Parte 1"
- assertNotVisible: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
- tapOn: "Atrás"
