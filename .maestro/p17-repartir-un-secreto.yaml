# P-17, Repartir un secreto (tarea 4): repartir una frase BIP-39 de prueba en 2 de 3 partes y recomponerla
# con dos de ellas; los textos de «Lo que no protege» y del aviso; el borrado al volver atrás.
# El vector oficial de SLIP-0039 está en semiautomaticas/p17-recomponer-vector-oficial.yaml (pide una
# variable), y el borrado al bloquear, en borra-datos/p15-p16-p17-bloquear-borra.yaml.
# No borra datos: se puede usar en tu móvil.
# La frase es el vector de prueba público de BIP-39 con la entropía a cero (16 bytes 00): no es el secreto
# de nadie. Al recomponer tiene que salir «00000000000000000000000000000000» y la misma frase.
# Las partes salen distintas cada vez (el identificador del reparto es al azar): el flujo las copia de la
# pantalla con copyTextFrom y las vuelve a escribir.
appId: io.github.egt17baa.seguridad
name: "P-17 Repartir un secreto - repartir y recomponer"
tags:
  - clavero-1.4.0
  - automatica
---
- runFlow: comun/abrir-app.yaml
- runFlow:
    file: comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Repartir un secreto.*'
- assertVisible: "Repartir un secreto"
- assertVisible: 'Divide un secreto en partes \(SLIP-0039\): con las necesarias se recompone; con menos, no\.'
- scrollUntilVisible:
    element:
      text: "Frase BIP-39"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Secreto en hex"
    direction: DOWN

# Repartir: 1 grupo, 2 partes necesarias de 3 (lo de entrada).
- scrollUntilVisible:
    element:
      text: 'Frase BIP-39 \(12, 15, 18, 21 o 24 palabras en inglés\)'
    direction: DOWN
- tapOn: 'Frase BIP-39 \(12, 15, 18, 21 o 24 palabras en inglés\)'
- inputText: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Se reparte la entropía de la frase, y al recomponer sale la misma frase\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo normal es un solo grupo: por ejemplo, 2 partes necesarias de 3\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'No las uses como copia SLIP-39 de una cartera: darían otra cartera\. Recomponlas en Clavero\.'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Aviso"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Repartir"
      below:
        text: 'No las uses como copia SLIP-39 de una cartera: darían otra cartera\. Recomponlas en Clavero\.'
    direction: DOWN
    timeout: 20000
# Maestro no ve si un botón está activo por su texto: se espera a que deje de verse desactivado.
- extendedWaitUntil:
    notVisible:
      enabled: false
      containsDescendants:
        - text: "Repartir"
    timeout: 30000
- tapOn:
    text: "Repartir"
    below:
      text: 'No las uses como copia SLIP-39 de una cartera: darían otra cartera\. Recomponlas en Clavero\.'
# Las partes salen debajo del botón, fuera de la pantalla: se baja hasta ellas mientras se calculan.
- scrollUntilVisible:
    element:
      text: "Un solo grupo."
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Grupo 1: hacen falta 2 de estas 3 partes"
    direction: DOWN

# Las partes de 128 bits tienen 20 palabras. Se copian la 1 y la 2.
- scrollUntilVisible:
    element:
      text: "Parte 1"
    direction: DOWN
    centerElement: true
- copyTextFrom:
    text: '([a-z]+ ){19}[a-z]+'
    below:
      text: "Parte 1"
- evalScript: ${output.parte1 = maestro.copiedText}
- scrollUntilVisible:
    element:
      text: "Parte 2"
    direction: DOWN
    centerElement: true
- copyTextFrom:
    text: '([a-z]+ ){19}[a-z]+'
    below:
      text: "Parte 2"
- evalScript: ${output.parte2 = maestro.copiedText}
- assertTrue: ${output.parte1 != output.parte2}
- assertTrue: ${output.parte1.split(' ').length == 20}

# Recomponer con las dos partes, una por línea.
- scrollUntilVisible:
    element:
      text: "Recomponer"
    direction: UP
- tapOn: "Recomponer"
- scrollUntilVisible:
    element:
      text: "Partes, una por línea"
    direction: DOWN
- tapOn: "Partes, una por línea"
- inputText: ${output.parte1}
- pressKey: Enter
- inputText: ${output.parte2}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Escribe o pega las partes necesarias, cada una en su línea\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Recomponer"
      below:
        text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- tapOn:
    text: "Recomponer"
    below:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
# El resultado sale debajo del botón.
- scrollUntilVisible:
    element:
      text: "00000000000000000000000000000000"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Secreto en hex"
    direction: UP
- scrollUntilVisible:
    element:
      text: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Como frase BIP-39"
    direction: UP
- scrollUntilVisible:
    element:
      text: 'Esta es la frase BIP-39 de estos bytes\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Si la contraseña no es la que se usó al repartir, este es otro secreto distinto: SLIP-0039 no avisa\.'
    direction: DOWN

# Con una sola parte no basta. Se entra otra vez (volver atrás lo borra todo) en lugar de borrar el campo:
# eraseText de Maestro solo borra lo que está a la izquierda del cursor.
- tapOn: "Atrás"
- runFlow:
    file: comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Repartir un secreto.*'
- scrollUntilVisible:
    element:
      text: "Recomponer"
    direction: DOWN
- tapOn: "Recomponer"
- scrollUntilVisible:
    element:
      text: "Partes, una por línea"
    direction: DOWN
- tapOn: "Partes, una por línea"
- inputText: ${output.parte1}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Recomponer"
      below:
        text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
    direction: DOWN
- tapOn:
    text: "Recomponer"
    below:
      text: 'Solo caracteres ASCII imprimibles, como pide SLIP-0039.*'
- scrollUntilVisible:
    element:
      text: 'En el grupo 1 hacen falta 2 partes y hay 1\.'
    direction: DOWN
    timeout: 60000
- assertNotVisible: "00000000000000000000000000000000"

# Volver atrás lo borra todo.
- tapOn: "Atrás"
- runFlow:
    file: comun/abrir-herramienta.yaml
    env:
      HERRAMIENTA: 'Repartir un secreto.*'
- assertNotVisible: "Parte 1"
- assertNotVisible: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# 1.4.2 (texto mínimo): el aviso, lo que no protege y el borrado, en una línea a la vista; los textos
# completos, plegados. Primero el «Más información» del aviso (al abrirlo pasa a «Menos información»), y
# después el del final de la pantalla, que entonces es el único que dice «Más información».
- scrollUntilVisible:
    element:
      text: 'No las uses como copia SLIP-39 de una cartera: darían otra cartera\. Recomponlas en Clavero\.'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Más información"
    direction: DOWN
- tapOn: "Más información"
- scrollUntilVisible:
    element:
      text: 'Estas partes no son una copia SLIP-39 de cartera\. Metidas en una cartera de hardware.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Quien reúna las partes necesarias obtiene el secreto: guarda cada una en un sitio distinto\.'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo escrito y el resultado se borran al volver atrás.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Más información"
    direction: DOWN
- tapOn: "Más información"
- scrollUntilVisible:
    element:
      text: 'Divide una frase BIP-39 o un secreto en hex en varias partes, con el reparto de secretos de Shamir de SLIP-0039\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Lo que no protege"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Quien reúna las partes necesarias obtiene el secreto, sea quien sea.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo que escribes aquí y el resultado se borran si vuelves atrás.*'
    direction: DOWN
- tapOn: "Atrás"
