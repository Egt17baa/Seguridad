# P-20, versión y licencias: Ajustes → Acerca de dice «Clavero 1.4.3», y en «Ver licencias» se abren las
# de la lista de SLIP-0039 y de Bouncy Castle, con scrypt, SHA-3, BLAKE2b y BLAKE3 en su nota.
# No borra datos: se puede usar en tu móvil.
appId: io.github.egt17baa.seguridad
name: "P-20 Versión y licencias"
tags:
  - clavero-1.4.0
  - automatica
---
- runFlow: comun/abrir-app.yaml
- tapOn: "Ajustes"
# Es lo último de Ajustes, y con la bóveda abierta Ajustes es largo: más tiempo, y basta con verlo a medias.
- scrollUntilVisible:
    element:
      text: 'Acerca de, licencias y avisos'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn: 'Acerca de, licencias y avisos'
- extendedWaitUntil:
    visible: "Clavero 1.4.3"
    timeout: 15000
- assertVisible: "Acerca de"
- scrollUntilVisible:
    element:
      text: "Ver licencias"
    direction: DOWN
- tapOn: "Ver licencias"
- extendedWaitUntil:
    visible: "Licencias"
    timeout: 15000
- assertVisible: "Clavero solo usa componentes de código abierto con licencia libre y gratuita."

# Bouncy Castle: su nota nombra scrypt, SHA-3, BLAKE2b y BLAKE3, y su licencia se abre.
- scrollUntilVisible:
    element:
      text: "Bouncy Castle"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: '.*scrypt.*SHA-3, BLAKE2b, BLAKE3.*'
    direction: DOWN
- tapOn:
    text: "Ver el texto de la licencia"
    below:
      text: "Bouncy Castle"
- scrollUntilVisible:
    element:
      text: '.*The Legion of the Bouncy Castle Inc\..*'
    direction: DOWN

# La lista de palabras SLIP-0039: su licencia (MIT) se abre.
- scrollUntilVisible:
    element:
      text: "Lista de palabras SLIP-0039"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: 'Las 1\.024 palabras en inglés de SLIP-0039, sin cambios.*'
    direction: DOWN
# Su botón va debajo de la nota y del enlace: con letra grande queda fuera de la pantalla. Se busca debajo
# del enlace, que solo tiene esta tarjeta.
- scrollUntilVisible:
    element:
      text: "https://github.com/trezor/python-shamir-mnemonic"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Ver el texto de la licencia"
      below:
        text: "https://github.com/trezor/python-shamir-mnemonic"
    direction: DOWN
- tapOn:
    text: "Ver el texto de la licencia"
    below:
      text: "https://github.com/trezor/python-shamir-mnemonic"
- scrollUntilVisible:
    element:
      text: '.*SLIP-0039 English wordlist \(slip39_english\.txt\).*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: '.*Permission is hereby granted, free of charge.*'
    direction: DOWN
- tapOn: "Atrás"
- tapOn: "Atrás"
