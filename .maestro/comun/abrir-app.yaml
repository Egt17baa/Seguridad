# Subflujo: abre Clavero SIN borrar sus datos.
# Acepta el aviso «Antes de empezar» y el de «Nuevo nombre» si salen, cierra el diálogo de la huella si
# se abre solo (con la bóveda bloqueada y la huella activada) y espera a la barra de pestañas.
# No crea, no abre y no cambia la bóveda.
appId: io.github.egt17baa.seguridad
---
- launchApp:
    appId: io.github.egt17baa.seguridad
    stopApp: true
- extendedWaitUntil:
    visible: 'Antes de empezar|Herramientas'
    timeout: 20000
- runFlow:
    when:
      visible: "Antes de empezar"
    commands:
      - scrollUntilVisible:
          element:
            text: "Entendido"
          direction: DOWN
          timeout: 15000
      - tapOn: "Entendido"
- runFlow:
    when:
      visible: "Usar contraseña maestra"
    commands:
      - tapOn: "Usar contraseña maestra"
- runFlow:
    when:
      visible: "Nuevo nombre"
    commands:
      - tapOn: "Entendido"
- extendedWaitUntil:
    visible: "Herramientas"
    timeout: 20000
