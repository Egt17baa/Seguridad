# BORRA TODOS LOS DATOS DE CLAVERO (clearState): solo en el emulador o en un móvil sin tu bóveda real.
# Crea una bóveda de PRUEBA con una maestra de prueba escrita aquí (MAESTRA), nunca la tuya.
#
# La regla de una maestra nueva (CRY-A01 de la 1.3.1 y RT-3, decisión del dueño (h) de la 1.4.0), en
# «Crea tu bóveda» de una instalación nueva: «corta» pide 10 caracteres; «P4ssw0rd2024!» (una palabra
# conocida en leet) y «Password1!» dan el texto MASTER_TOO_WEAK y «Crear bóveda» sigue desactivado; una
# frase de 5 palabras y un poco más no da ningún aviso. Después crea la bóveda, que es el primer paso de
# P-19 («crear una bóveda nueva»).
# Maestro solo escribe caracteres ASCII en Android, por eso no se prueba «contraseña1» (la «ñ»).
# Cada caso empieza otra vez desde cero (clearState) en lugar de borrar el campo: eraseText de Maestro solo
# borra a la izquierda del cursor, y un campo de contraseña ya escrito no se encuentra por su etiqueta.
# Después de escribir se cierra el teclado y se baja hasta lo que se comprueba: Maestro solo ve lo que
# está en la pantalla, y el teclado tapa media pantalla.
appId: io.github.egt17baa.seguridad
name: "P-19 Crear una bóveda - la regla de la maestra nueva"
tags:
  - clavero-1.4.0
  - automatica
  - borra-datos
env:
  MAESTRA: nube-ladera-pino-ancla-trigo-prueba
---
- runFlow: ../comun/inicio-desde-cero.yaml
# La pantalla de crear, sin escribir nada: lo de abajo queda fuera de la pantalla con letra grande.
- assertVisible: 'Guarda contraseñas, frases semilla, notas y códigos 2FA, cifrados en este móvil con tu contraseña maestra\.'
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Importar una copia exportada"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Sirve una copia \.sgbak de esta app \(con los adjuntos\).*'
    direction: DOWN

# Corta.
- runFlow: ../comun/inicio-desde-cero.yaml
- tapOn: 'Contraseña maestra \(mínimo 10 caracteres\)'
- inputText: "corta"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Mínimo 10 caracteres"
    direction: DOWN
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN

# Una palabra conocida en leet, con números y signos alrededor (RT-3).
- runFlow: ../comun/inicio-desde-cero.yaml
- tapOn: 'Contraseña maestra \(mínimo 10 caracteres\)'
- inputText: "P4ssw0rd2024!"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Esta contraseña es fácil de adivinar\. Usa una frase de 5 o 6 palabras que solo tú conozcas.*'
    direction: DOWN
- assertNotVisible: "Mínimo 10 caracteres"
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN

# Una sola palabra conocida con mayúscula, número y signo.
- runFlow: ../comun/inicio-desde-cero.yaml
- tapOn: 'Contraseña maestra \(mínimo 10 caracteres\)'
- inputText: "Password1!"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Esta contraseña es fácil de adivinar\. Usa una frase de 5 o 6 palabras que solo tú conozcas.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN

# La maestra de prueba: ningún aviso. Repetida mal: «No coinciden».
- runFlow: ../comun/inicio-desde-cero.yaml
- tapOn: 'Contraseña maestra \(mínimo 10 caracteres\)'
- inputText: ${MAESTRA}
- hideKeyboard
- assertNotVisible: 'Esta contraseña es fácil de adivinar.*'
- assertNotVisible: "Mínimo 10 caracteres"
- scrollUntilVisible:
    element:
      text: 'Consejo: usa una frase de 5 o 6 palabras que solo tú conozcas.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Repítela"
    direction: UP
- tapOn: "Repítela"
- inputText: "otra-cosa-distinta"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "No coinciden"
    direction: DOWN
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN

# Bien escrita las dos veces: sin la casilla, «Crear bóveda» sigue desactivado; con ella, crea la bóveda.
- runFlow: ../comun/inicio-desde-cero.yaml
- tapOn: 'Contraseña maestra \(mínimo 10 caracteres\)'
- inputText: ${MAESTRA}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Repítela"
    direction: DOWN
- tapOn: "Repítela"
- inputText: ${MAESTRA}
- hideKeyboard
- assertNotVisible: "No coinciden"
- scrollUntilVisible:
    element:
      containsDescendants:
        - text: "Crear bóveda"
      enabled: false
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Entiendo que si olvido la contraseña maestra.*'
    direction: UP
- tapOn: 'Entiendo que si olvido la contraseña maestra.*'
- scrollUntilVisible:
    element:
      text: "Crear bóveda"
    direction: DOWN
# Maestro no ve si un botón está activo por su texto: se espera a que deje de verse desactivado.
- extendedWaitUntil:
    notVisible:
      enabled: false
      containsDescendants:
        - text: "Crear bóveda"
    timeout: 30000
- tapOn: "Crear bóveda"
# Argon2id con el coste del perfil: unos segundos en un móvil, algo más en el emulador.
- extendedWaitUntil:
    visible: "Bloquear"
    timeout: 120000
- assertVisible: "Más opciones"

# Bloquear y desbloquear con la maestra de prueba.
- tapOn: "Bloquear"
- runFlow:
    file: ../comun/desbloquear.yaml
    env:
      MAESTRA: ${MAESTRA}
