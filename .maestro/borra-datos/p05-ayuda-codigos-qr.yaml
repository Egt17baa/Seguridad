# BORRA TODOS LOS DATOS DE CLAVERO (clearState): solo en el emulador o en un móvil sin tu bóveda real.
# Crea una bóveda de PRUEBA con una maestra de prueba escrita aquí (MAESTRA), nunca la tuya.
#
# P-5 (en parte, tarea 10, R21): la primera pantalla de «Importar de otra app» dice cómo traer los códigos
# que solo se exportan como QR, y los botones que nombra existen: «Añadir», el tipo «Código 2FA» y
# «Escanear QR». Escanear los QR de otro móvil y comparar los códigos es manual.
# Los textos que se comprueban son los literales de imports/ImportTexts.kt; donde nombran otra app, la
# expresión regular la cambia por «.*».
appId: io.github.egt17baa.seguridad
name: "P-5 Importar de otra app - la ayuda de los códigos en QR"
tags:
  - clavero-1.4.0
  - automatica
  - borra-datos
env:
  MAESTRA: nube-ladera-pino-ancla-trigo-prueba
---
- runFlow: ../comun/inicio-desde-cero.yaml
- runFlow:
    file: ../comun/crear-boveda.yaml
    env:
      MAESTRA: ${MAESTRA}
- tapOn: "Más opciones"
- tapOn: "Importar de otra app"
- extendedWaitUntil:
    visible: "Elegir archivo"
    timeout: 15000
- assertVisible: "Importar de otra app"
# 1.4.2 (texto mínimo): una línea a la vista; la explicación y la ayuda de los QR, plegadas bajo el primer
# «Más información» (al abrirlo pasa a «Menos información»).
- assertVisible: 'Añade a la bóveda lo que exportaste de otro gestor de contraseñas, un navegador o una app de 2FA\. Antes te enseña lo que entra\.'
- tapOn:
    text: "Más información"
    index: 0
- scrollUntilVisible:
    element:
      text: 'Lee un archivo que hayas exportado de otro gestor de contraseñas, de un navegador o de una app de 2FA.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: '.* solo exporta sus códigos como uno o varios códigos QR.*pulsa «Añadir», elige «Código 2FA» y luego «Escanear QR».*'
    direction: DOWN
# Los avisos del final: una línea de cada uno a la vista, y completos bajo el otro «Más información», que
# ahora es el único que lo dice.
- scrollUntilVisible:
    element:
      text: 'Un archivo exportado sin contraseña suele estar sin cifrar en tu móvil\.'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo leído se borra al volver atrás.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Más información"
    direction: DOWN
- tapOn: "Más información"
- scrollUntilVisible:
    element:
      text: 'Clavero no protege el archivo exportado\..*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Lo leído del archivo, la contraseña que escribas y la vista previa se borran si vuelves atrás.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Los nombres de otras apps son marcas de sus titulares. Clavero no tiene relación con ellos."
    direction: DOWN
- tapOn: "Atrás"

# Los botones que nombra la ayuda.
# 2.0: la bóveda vacía tiene su botón «Crear la primera», con su texto.
- extendedWaitUntil:
    visible: 'Tu bóveda está vacía\.'
    timeout: 10000
- tapOn: "Crear la primera"
- extendedWaitUntil:
    visible: "Nueva entrada"
    timeout: 10000
# Los tipos van en una fila que se desliza: en una pantalla estrecha o con la letra grande, «Código 2FA»
# puede quedar fuera, a la derecha.
- runFlow:
    when:
      notVisible: '.*Código 2FA'
    commands:
      # Desde el segundo tipo, para que el dedo tenga recorrido hasta el borde izquierdo.
      - swipe:
          from:
            text: '.*Frase semilla'
          direction: LEFT
- tapOn: '.*Código 2FA'
- scrollUntilVisible:
    element:
      text: '.*Escanear QR'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Pegar enlace"
    direction: DOWN
- tapOn: "Atrás"
